<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审查记录 · 番茄小说排行榜</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/ai-logs.css">
    <link rel="stylesheet" href="/css/records.css">
    <script type="module" src="/js/records.js"></script>
</head>
<body>
<!-- ===== 顶部：子站页头（回榜单 + 标题 + 审查记录/失败日志 tab） =====
     CSP 是 script-src 'self'，脚本与样式只能走外部文件 -->
<header class="logs-head">
    <div class="logs-head-inner">
        <div class="logs-head-main">
            <a class="btn btn-ghost btn-sm logs-back" href="/" title="回榜单">← 回榜单</a>
            <div class="logs-title-group">
                <h1 class="logs-title rec-title">审查记录</h1>
                <p class="logs-sub">AI 判定流水 · 章节拉取 · 失败日志</p>
            </div>
        </div>
        <nav class="logs-tabs" aria-label="AI 日志视图">
            <a class="logs-tab is-active" href="/records" aria-current="page">
                <span class="logs-tab-ico" aria-hidden="true">📜</span>审查记录
            </a>
            <a class="logs-tab" href="/faults">
                <span class="logs-tab-ico" aria-hidden="true">📋</span>失败日志
            </a>
        </nav>
    </div>
</header>

<main class="rec-main">
    <section class="logs-toolbar rec-toolbar" aria-label="查询条件">
        <div class="logs-field">
            <label for="recWindow">时间窗口</label>
            <select class="select" id="recWindow">
                <option value="6">最近 6 小时</option>
                <option value="24" selected>最近 24 小时</option>
                <option value="72">最近 3 天</option>
                <option value="168">最近 7 天</option>
                <option value="720">最近 30 天</option>
            </select>
        </div>
        <label class="logs-switch">
            <input type="checkbox" id="recAuto" checked>
            <span>自动刷新 3 秒</span>
        </label>
        <button type="button" class="btn btn-tonal" id="recRefresh">
            <span class="btn-text">刷新</span>
        </button>
        <span class="logs-updated rec-updated" id="recUpdated">正在加载…</span>
    </section>

    <!-- KPI：窗口内的三个数量级（拉取 / 在飞 / 结果分布） -->
    <section class="rec-kpi" id="recKpi" aria-label="概览">
        <div class="rec-kpi-item rec-kpi-fetch">
            <span class="rec-kpi-label">窗口内拉取</span>
            <span class="rec-kpi-value" id="kpiFetch">—</span>
            <span class="rec-kpi-sub" id="kpiFetchSub">本书 / 章节</span>
        </div>
        <div class="rec-kpi-item rec-kpi-running">
            <span class="rec-kpi-label">正在审查</span>
            <span class="rec-kpi-value" id="kpiRunning">—</span>
            <span class="rec-kpi-sub">进行中的动作</span>
        </div>
        <div class="rec-kpi-item rec-kpi-result">
            <span class="rec-kpi-label">窗口内结论</span>
            <span class="rec-kpi-value" id="kpiResults">—</span>
            <span class="rec-kpi-sub rec-kpi-mix" id="kpiResultsSub">AI / 疑似 / 非 AI</span>
        </div>
    </section>

    <!-- 1) 正在审查：内存态，只有真的在跑才有内容 -->
    <section class="rec-block" aria-labelledby="recRunningTitle">
        <div class="rec-block-head">
            <h2 class="rec-block-title" id="recRunningTitle">
                正在 AI 审查
                <span class="rec-count" id="recRunningCount">0</span>
            </h2>
            <span class="rec-block-note">同步请求，跑完落到「判定结果」</span>
        </div>
        <div class="rec-running" id="recRunning">
            <p class="rec-empty">当前没有进行中的审查</p>
        </div>
    </section>

    <!-- 2) 正常拉取章节：官方前 10 章落库后的聚合视图 -->
    <section class="rec-block" aria-labelledby="recFetchTitle">
        <div class="rec-block-head">
            <h2 class="rec-block-title" id="recFetchTitle">
                正常拉取章节
                <span class="rec-count" id="recFetchCount">0</span>
            </h2>
            <span class="rec-block-note" title="只统计落进 novel_chapter 的官方可读区正文；第三方通道的深章不落库，所以不在这里">官方可读区正文 · 第三方深章不落库</span>
        </div>
        <div class="logs-table-wrap">
            <table class="rec-table rec-table-fetch">
                <thead>
                <tr>
                    <th scope="col">书名</th>
                    <th scope="col">章节数</th>
                    <th scope="col">字数</th>
                    <th scope="col">最新章号</th>
                    <th scope="col">最近拉取</th>
                    <th scope="col">残留 PUA</th>
                </tr>
                </thead>
                <tbody id="recFetchRows">
                <tr><td colspan="6" class="rec-empty">—</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- 3) 判定结果：append-only 流水，每次判定一行 -->
    <section class="rec-block" aria-labelledby="recResultTitle">
        <div class="rec-block-head">
            <h2 class="rec-block-title" id="recResultTitle">
                判定结果
                <span class="rec-count" id="recResultCount">0</span>
            </h2>
            <input class="input rec-search" id="resultSearch" type="search" placeholder="按书名检索"
                   aria-label="按书名检索判定结果" autocomplete="off">
        </div>
        <div class="rec-result-bar">
            <div class="logs-chips" id="resultFlagChips" role="group" aria-label="按结论筛选">
                <button type="button" class="logs-chip is-active" data-flag="" aria-pressed="true">
                    全部 <span class="logs-chip-count" data-chip-count="all">0</span>
                </button>
                <button type="button" class="logs-chip" data-flag="2" aria-pressed="false">
                    <span class="logs-dot logs-dot-ai" aria-hidden="true"></span>AI
                    <span class="logs-chip-count" data-chip-count="2">0</span>
                </button>
                <button type="button" class="logs-chip" data-flag="3" aria-pressed="false">
                    <span class="logs-dot logs-dot-suspect" aria-hidden="true"></span>疑似
                    <span class="logs-chip-count" data-chip-count="3">0</span>
                </button>
                <button type="button" class="logs-chip" data-flag="1" aria-pressed="false">
                    <span class="logs-dot logs-dot-human" aria-hidden="true"></span>非 AI
                    <span class="logs-chip-count" data-chip-count="1">0</span>
                </button>
                <button type="button" class="logs-chip" data-flag="failed" aria-pressed="false">
                    <span class="logs-dot logs-dot-failed" aria-hidden="true"></span>失败
                    <span class="logs-chip-count" data-chip-count="failed">0</span>
                </button>
            </div>
            <p class="rec-hint">每轮判定一行，换引擎重判不会覆盖旧记录。</p>
        </div>
        <div class="logs-table-wrap">
            <table class="rec-table rec-table-result">
                <thead>
                <tr>
                    <th scope="col">时间</th>
                    <th scope="col">书名</th>
                    <th scope="col">引擎 · 型号</th>
                    <th scope="col">结论</th>
                    <th scope="col">概率</th>
                    <th scope="col">章节</th>
                    <th scope="col">类型</th>
                    <th scope="col">理由</th>
                </tr>
                </thead>
                <tbody id="recResultRows">
                <tr><td colspan="8" class="rec-empty">—</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
