<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄小说排行榜</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<!-- ===== 分类导航 ===== -->
<nav class="category-nav" id="categoryNav" style="top: 0;">
    <div class="nav-inner" id="navInner"></div>
</nav>

<!-- ===== 主内容 ===== -->
<div class="container">
    <!-- 统计 + 控制栏 -->
    <div class="stats" id="statsBar">
        <div class="info">
            共 <strong id="totalCount">0</strong> 本小说 ·
            当前分类：<span id="currentCategory">全部</span>
        </div>
        <div class="controls">
            <label for="pageSizeSelect">每页显示：</label>
            <select id="pageSizeSelect" onchange="onPageSizeChange()">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30" selected>30</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
            <button class="fetch-all-btn" onclick="fetchAllData()">📥 一键获取全部</button>
        </div>
    </div>

    <!-- 筛选栏 -->
    <!-- ★★★ 筛选栏（仅在“全部”模式下显示） ★★★ -->
    <div class="filter-bar" id="filterBar" style="display: flex;">
        <div class="filter-group filter-dropdown-group">
            <label>分类：</label>
            <div class="dropdown-multi" id="dropdownMulti">
                <button class="dropdown-toggle" onclick="toggleDropdown()">
                    <span id="dropdownLabel">全部</span>
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <!-- 由 JavaScript 动态生成 -->
                </div>
            </div>
        </div>
        <div class="filter-group">
            <label for="filterWord">字数：</label>
            <select id="filterWord" onchange="onFilterChange()">
                <option value="">全部</option>
                <option value="100w以内">100万以内</option>
                <option value="100w以上" selected>100万以上</option>
                <option value="200w以上">200万以上</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterStatus">状态：</label>
            <select id="filterStatus" onchange="onFilterChange()">
                <option value="">全部</option>
                <option value="连载中" selected>连载中</option>   <!-- ★ 默认选中 -->
                <option value="已完结">已完结</option>
            </select>
        </div>
    </div>

    <div id="bookList" class="book-list">
        <div class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
